<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>functions</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p class="title">Rock Paper Scissors</p>

    <button class="move-button js-rock-button"><img src="emojis/rock-emoji.png" alt="" class="rock-image"></button>
    <button class="move-button js-paper-button"><img src="emojis/paper-emoji.png" alt="" class="paper-image"></button>
    <button class="move-button js-scissors-button"><img src="emojis/scissors-emoji.png" alt=""
            class="scissors-image"></button>

    <p class="js-result result">You Win.</p>
    <p class="js-moves">
        You
        <img src="emojis/rock-emoji.png" alt="" class="move-icon">
        <img src="emojis/paper-emoji.png" alt="" class="move-icon">
        Computer
    </p>
    <p class="js-score score"></p>

    <button onclick="score={
        wins: 0,
        losses: 0,
        ties: 0
    };
    localStorage.removeItem('score');
    updateScore();" class="reset-score-button">Reset Score</button>
    <button class="auto-play-button" onclick="
    autoPlay();">Auto Play</button>
    <script src="script.js"></script>

</body>

</html>
